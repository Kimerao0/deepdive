packages:
  - apps/*
  - packages/*

# Fail install when the running Node violates engines.node, instead of
# failing mysteriously at runtime. Pairs with .nvmrc (0.4).
engineStrict: true

allowBuilds:
  sharp: false
  # Denied like sharp: napi packages ship prebuilt binaries as optional deps;
  # the build script is only the from-source fallback. Verified by the resolver
  # falsification in 0.3 — if @deepdive/* resolves, the denial cost nothing.
  unrs-resolver: false

catalog:
  typescript: 6.0.3
  vitest: 4.1.10
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@types/node": 24.13.3
